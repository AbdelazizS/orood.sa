[program:arooth-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/arooth/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/arooth/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/arooth/queue.log
stopwaitsecs=3600
