# Arooth — React SPA + Laravel API
# Canonical host: www.arooth.com (arooth.com → 301)
#
# Install:
#   cp deploy/nginx/arooth.conf /etc/nginx/sites-available/arooth
#   ln -sf /etc/nginx/sites-available/arooth /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: certbot --nginx -d arooth.com -d www.arooth.com

# ── HTTP: bare domain → https://www ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name arooth.com;
    return 301 https://www.arooth.com$request_uri;
}

# ── HTTP: www → https://www ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.arooth.com;
    return 301 https://www.arooth.com$request_uri;
}

# ── HTTPS: bare domain → https://www ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arooth.com;

    ssl_certificate /etc/letsencrypt/live/arooth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arooth.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.arooth.com$request_uri;
}

# ── HTTPS: www (main site) ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.arooth.com;

    ssl_certificate /etc/letsencrypt/live/arooth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arooth.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/arooth/frontend/dist;
    index index.html;

    client_max_body_size 32M;

    location ~ ^/(sitemap.*\.xml|robots\.txt|up)$ {
        root /var/www/arooth/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /api/ {
        root /var/www/arooth/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/arooth/backend/public;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /storage/ {
        alias /var/www/arooth/backend/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
