# Orood — React SPA + Laravel API (same host)
# Install: cp to /etc/nginx/sites-available/arooth && ln -s sites-enabled && nginx -t

server {
    listen 80;
    listen [::]:80;
    server_name arooth.com www.arooth.com;

    # React build
    root /var/www/arooth/frontend/dist;
    index index.html;

    client_max_body_size 32M;

    # Laravel: health, robots, sitemaps (must not fall through to index.html)
    location ~ ^/(sitemap.*\.xml|robots\.txt|up)$ {
        root /var/www/arooth/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel API
    location ^~ /api/ {
        root /var/www/arooth/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/arooth/backend/public;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Uploaded branding / listing images
    location ^~ /storage/ {
        alias /var/www/arooth/backend/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA — all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

# After Certbot: certbot --nginx -d arooth.com -d www.arooth.com
# Then set APP_URL / VITE_API_URL to https:// in .env files and rebuild frontend.
